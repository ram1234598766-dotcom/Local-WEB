name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # Nightly chaos tests
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        type: string
      skip_tests:
        description: 'Skip tests (emergency release)'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: '1.26'

jobs:
  # ============================================================
  # QUALITY GATES
  # ============================================================
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: --timeout=10m
      
      - name: Go vet
        run: go vet ./...
      
      - name: Go fmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted:"
            gofmt -l .
            exit 1
          fi
      
      - name: Go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Download dependencies
        run: go mod download
      
      - name: Run unit tests with race detector
        run: go test -race -count=1 -short -timeout 20m ./...
      
      - name: Run integration tests
        run: go test -tags=integration ./test/integration/... -v -count=1 -timeout 120s
      
      - name: Generate coverage
        run: go test -short -coverprofile=coverage.out ./...
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  test-race:
    name: Race Detector Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Run tests with race detector
        run: |
          CGO_ENABLED=1 go test -race -count=1 -short -timeout 20m ./pkg/...

  test-chaos:
    name: Chaos Engineering Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Run chaos tests
        run: |
          CGO_ENABLED=1 go test -race -v ./pkg/chaos/... -count=1 -timeout 300s
      
      - name: Run chaos integration tests
        run: |
          CGO_ENABLED=1 go test -race -v ./pkg/chaos/... -count=1 -timeout 300s

  govulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...

  # ============================================================
  # BUILD BINARIES (cross-compile for all platforms)
  # ============================================================
  build:
    name: Cross-compile Binaries
    runs-on: ubuntu-latest
    needs: [lint, test, govulncheck]
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            cgo: "1"
          - os: linux
            arch: arm64
            cgo: "0"
          - os: windows
            arch: amd64
            cgo: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Build binaries
        run: |
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} CGO_ENABLED=${{ matrix.cgo }} go build -trimpath -ldflags="-s -w -X github.com/ram1234598766-dotcom/Local-WEB/internal/version.Version=${{ github.ref_name }} -X github.com/ram1234598766-dotcom/Local-WEB/internal/version.Commit=${{ github.sha }} -X github.com/ram1234598766-dotcom/Local-WEB/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o dist/localweb-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }} ./cmd/node
          
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/localweb-cli-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }} ./cmd/cli
      
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 7

  # ============================================================
  # MACOS BUILD (darwin targets)
  # ============================================================
  build-macos:
    name: Cross-compile macOS Binaries
    runs-on: macos-latest
    needs: [lint, test, govulncheck]
    strategy:
      matrix:
        include:
          - os: darwin
            arch: amd64
            cgo: "1"
          - os: darwin
            arch: arm64
            cgo: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Build binaries
        run: |
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} CGO_ENABLED=${{ matrix.cgo }} go build -trimpath -ldflags="-s -w -X github.com/ram1234598766-dotcom/Local-WEB/internal/version.Version=${{ github.ref_name }} -X github.com/ram1234598766-dotcom/Local-WEB/internal/version.Commit=${{ github.sha }} -X github.com/ram1234598766-dotcom/Local-WEB/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o dist/localweb-${{ matrix.os }}-${{ matrix.arch }} ./cmd/node
          
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/localweb-cli-${{ matrix.os }}-${{ matrix.arch }} ./cmd/cli
      
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 7