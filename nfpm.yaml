# nfpm configuration for LocalWEB Linux packages (simplified for nfpm v2.35+)
name: "localweb"
version: "1.0.0"
epoch: 1
release: "1"
vendor: "LocalWEB Project"
homepage: "https://github.com/ram1234598766-dotcom/Local-WEB"
maintainer: "LocalWEB Team <team@localweb.io>"
description: "Local-first, encrypted mesh network - P2P networking stack with DNS, HTTP, Email, Messaging, Files, Docs, Registry, Voice, VPN"
license: "MIT"
section: "net"
priority: "optional"
arch: "amd64"

contents:
  - src: "dist/localweb-linux-amd64"
    dst: "/usr/bin/localweb"
    type: "file"
    file_info:
      mode: 493
      owner: "root"
      group: "root"
  - src: "dist/localweb-cli-linux-amd64"
    dst: "/usr/bin/localweb-cli"
    type: "file"
    file_info:
      mode: 493
      owner: "root"
      group: "root"
  - src: "README.md"
    dst: "/usr/share/doc/localweb/README.md"
    type: "doc"
  - src: "LICENSE"
    dst: "/usr/share/doc/localweb/LICENSE"
    type: "doc"
  - src: "CHANGELOG.md"
    dst: "/usr/share/doc/localweb/CHANGELOG.md"
    type: "doc"
  - src: "config/config.json"
    dst: "/etc/localweb/config.json"
    type: "config"
    file_info:
      mode: 416
      owner: "root"
      group: "localweb"
  - src: "systemd/localweb.service"
    dst: "/usr/lib/systemd/system/localweb.service"
    type: "config"
    file_info:
      mode: 420
      owner: "root"
      group: "root"
  - src: "systemd/localweb@.service"
    dst: "/usr/lib/systemd/system/localweb@.service"
    type: "config"
    file_info:
      mode: 420
      owner: "root"
      group: "root"

scripts:
  preinstall: "installers/linux/preinstall.sh"
  postinstall: "installers/linux/postinstall.sh"
  preremove: "installers/linux/preremove.sh"
  postremove: "installers/linux/postremove.sh"

depends:
  - "systemd"
  - "libc6 (>= 2.31)"
  - "capabilities"

recommends:
  - "wireguard-tools"
  - "bluez"
  - "avahi-daemon"
  - "iptables"

conflicts:
  - "localweb-node"

provides:
  - "localweb"