syntax = "proto3";

package dns;

option go_package = "github.com/ram1234598766-dotcom/Local-WEB/pkg/proto";

enum RecordType {
  RECORD_RESERVED = 0;
  TYPE_A = 1;
  TYPE_NS = 2;
  TYPE_CNAME = 5;
  TYPE_PTR = 12;
  TYPE_MX = 15;
  TYPE_TXT = 16;
  TYPE_AAAA = 28;
  TYPE_SRV = 33;
  TYPE_HTTPS = 65;
  TYPE_SVCB = 64;
}

message DNSRecord {
  string name = 1;
  RecordType type = 2;
  uint32 class_ = 3;
  uint32 ttl = 4;
  uint32 rd_length = 5;
  bytes rdata = 6;
}
