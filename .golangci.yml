version: "2"

linters:
  default: none
  enable:
    - misspell
    - ineffassign
    - govet
    - staticcheck
    - gosimple
    - unused
    - unconvert
    - unparam
    - predeclared
    - noctx
    - copyloopvar
    - intrange
    - nilerr
    - errorlint
    - exhaustruct
    - exhaustivestruct
    - gocyclo
    - goconst
    - gocritic
    - gosec
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - nilnesserr
    - wastedassign
    - typecheck
    - stylecheck
    - revive

linters-settings:
  gocyclo:
    min-complexity: 15
  goconst:
    min-len: 3
    min-occurrences: 3
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - dupImport
      - ifElseChain
      - singleCaseSwitch
      - whyNoLint
  revive:
    rules:
      - name: var-naming
        arguments: [["ID", "URL", "HTTP", "HTTPS", "JSON", "XML", "SQL", "DB", "TCP", "UDP", "IP", "DNS", "DHCP", "VPN", "QUIC", "PQ", "CRDT", "DHT", "BLE", "mDNS", "NAT", "ICE", "STUN", "TURN", "DTLS", "SRTP", "RTCP", "SDES", "DTLS-SRTP", "SCTP", "SRT", "FLV", "RTMP", "HLS", "DASH", "WebRTC", "P2P", "LAN", "WAN", "API", "SDK", "CLI", "GUI", "TUI", "SSH", "TLS", "SSL", "AES", "GCM", "RSA", "ECDSA", "Ed25519", "Kyber", "Dilithium", "Argon2", "PBKDF2", "SHA256", "SHA512", "BLAKE2", "BLAKE3", "X25519", "X448", "AES-GCM", "ChaCha20", "Poly1305", "HKDF", "PBKDF2", "SCrypt"]]
  gosec:
    excludes:
      - G104
      - G115
      - G204
  staticcheck:
    checks:
      - all
      - -ST1000
      - -ST1003
  govet:
    enable-all: true
    disable:
      - fieldalignment

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - gocyclo
        - gocritic
        - revive
        - staticcheck
        - govet
    - path: vendor
      linters:
        - all

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly